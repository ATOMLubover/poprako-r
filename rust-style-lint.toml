[trait-use-anonymous]
# The trait lists replace the packaged defaults entirely.
external_traits = [
    "anyhow::Context",
    "futures::FutureExt",
    "futures::StreamExt",
    "itertools::Itertools",
    "poprako_util::time::ToUnixMilli",
    "serde::Deserialize",
    "serde::Serialize",
    "std::convert::TryFrom",
    "std::convert::TryInto",
    "std::io::BufRead",
    "std::io::Read",
    "std::io::Write",
    "std::iter::Iterator",
    "tokio_stream::StreamExt",
    "tracing::Instrument",
]
# Traits consumed only through framework macro expansion.
macro_traits = [
    "crate::part_impl::repo::rdb_impl::incl::framework::BatchByIds",
    "crate::part_impl::repo::rdb_impl::incl::framework::Incl",
]
macro_markers = ["preloadable!"]
