# PopRaKo's selection and configuration for the shared rust-style-lint
# checker suite. The A/B-tier checkers run via `rust-style-lint` (see
# fmt/run-check.sh); this file selects which linters run and carries the
# project-specific rule parameters.

[linters]
# Comment out temporarily
# no-allow = true
no-inline-format = true
no-inline-tests = true
spacing-style = true
use-style = true
generic-where = true
no-type-hint = true
no-redundant-destructure = true
item-layout = true
doc-comment-coverage = true
forbidden-identifiers = true
module-dependency = true
visibility-style = true
trait-use-anonymous = true
prefer-if-let-guard = true
no-unnamed-fields = true

[qualified-call-site]
enforced_std_paths = ["std::env::var", "std::result::Result"]
exempt_poprako_paths = ["poprako_server::serve", "poprako_server::init_log"]
enforced_third_party_paths = [
    "jsonwebtoken::encode",
    "jsonwebtoken::decode",
    "serde_json::Value",
]

# --- per-checker overrides ------------------------------------------------

# Diesel generates schema.rs; it is not hand-authored Rust.
[spacing-style]
ignore_dirs = [
    ".git",
    ".hg",
    ".svn",
    ".idea",
    ".vscode",
    "target",
    "node_modules",
    "schema.rs",
]

[generic-where]
exclude_files = ["src/part_impl/repo/rdb_impl/schema.rs"]

[item-layout]
exclude_files = ["src/part_impl/repo/rdb_impl/schema.rs"]

[module-dependency]
exclude_files = ["src/part_impl/repo/rdb_impl/schema.rs"]

[visibility-style]
# Modules whose public struct fields are part of the data contract.
allow_public_fields = [
    "model",
    "data",
    "config",
    "value",
    "api::http::handler",
    "api::http::shared::metric",
    "complex::page::manifest",
    "part::image",
    "part::prom",
    "part::repo::oper",
    "part::effect::event",
    "part::prom::payload::chapter",
    "part_impl::repo::rdb_impl::entity",
    "part_impl::prom::rdb_impl::entity",
    "part_impl::prom::rdb_impl::handler",
    "key",
    "oper",
    "rdb_impl",
]
exclude_files = ["src/part_impl/repo/rdb_impl/schema.rs"]

[forbidden-identifiers]
# The words table replaces the packaged defaults entirely.
exclude_filenames = ["schema.rs"]

# Repository port/adapter layers follow their own naming conventions.
skip_module_paths = ["part/repo", "part_impl/repo"]
# Term and termbase modules are temporarily excluded from forbidden-identifier
# checks. NOTE: keep these keys before the [[words]] array — in TOML, keys
# after an array-of-tables entry belong to the last array element.
ignore_files = [
    "src/api/http/handler/term.rs",
    "src/api/http/handler/termbase.rs",
    "src/complex/term.rs",
    "src/complex/termbase.rs",
    "src/data/instr/term.rs",
    "src/data/instr/termbase.rs",
    "src/data/val/term.rs",
    "src/data/val/termbase.rs",
    "src/data/view/term.rs",
    "src/data/view/termbase.rs",
    "src/model/read/proj/term.rs",
    "src/model/read/proj/termbase.rs",
    "src/model/read/spec/term.rs",
    "src/model/read/spec/termbase.rs",
    "src/model/write/term.rs",
    "src/model/write/termbase.rs",
    "src/usecase/term.rs",
    "src/usecase/termbase.rs",
]

[[forbidden-identifiers.words]]
word = "result"
code = "FBD001"
message = "'result' is forbidden — name what the value represents"

[[forbidden-identifiers.words]]
word = "res"
code = "FBD002"
message = "'res' is a forbidden abbreviation of 'result'"

[[forbidden-identifiers.words]]
word = "error"
code = "FBD003"
message = "'error' is forbidden — use 'err' instead"

[[forbidden-identifiers.words]]
word = "closure"
code = "FBD005"
message = "'closure' is a forbidden word"

[[forbidden-identifiers.words]]
word = "connection"
code = "FBD006"
message = "'connection' is forbidden — use 'conn'"

[[forbidden-identifiers.words]]
word = "txn"
code = "FBD007"
message = "'txn' is a forbidden abbreviation of 'transaction'"

[[forbidden-identifiers.words]]
word = "tx"
code = "FBD008"
message = "'tx' is a forbidden abbreviation of 'transaction'"

[[forbidden-identifiers.words]]
word = "extension"
code = "FBD010"
message = "'extension' is forbidden — use 'ext' instead"

[[forbidden-identifiers.words]]
word = "previous"
code = "FBD011"
message = "'previous' is forbidden — use 'prev' instead"

[[forbidden-identifiers.words]]
word = "replace"
code = "FBD012"
message = "'replace' is forbidden — it is reserved for model layer"

[[forbidden-identifiers.words]]
word = "outcome"
code = "FBD013"
message = "'outcome' is forbidden"

[[forbidden-identifiers.words]]
